name: Build and Push WebGoat Docker Image (Corretto JDK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 리포지토리 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 (Amazon Corretto) 설치
      - name: Set up Amazon Corretto JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3️⃣ Maven으로 WebGoat 빌드
      - name: Build WebGoat JAR
        env:
          MAVEN_OPTS: >-
            --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
            --add-opens jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
          --add-opens java.base/java.lang=ALL-UNNAMED
          --add-opens java.base/java.lang.reflect=ALL-UNNAMED
          --add-opens java.base/java.io=ALL-UNNAMED
          --add-opens java.base/java.util=ALL-UNNAMED
          --add-opens java.base/java.util.regex=ALL-UNNAMED
          --add-opens java.base/java.net=ALL-UNNAMED
          --add-opens java.base/java.nio=ALL-UNNAMED
          --add-opens java.base/sun.nio.ch=ALL-UNNAMED
          --add-opens java.base/java.security=ALL-UNNAMED
        run: |
          mvn clean package -DskipTests
          ls -lh webgoat-server/target

      # 4️⃣ Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:v8.2.0-SNAPSHOT \
                       -f Dockerfile .

      # 6️⃣ Docker Hub로 푸시
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/webgoat:v8.2.0-SNAPSHOT
